name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment-Ziel wählen'
        required: true
        default: 'qual'
        type: choice
        options:
          - qual
          - prod

jobs:
  test:
    name: Quality Gates (Typecheck, Lint, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test

      - name: Pilot Test (E2E)
        run: npm run pilot

  deploy-qual:
    name: Deploy to Qual
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'qual')
    runs-on: ubuntu-latest
    environment:
      name: qual
      url: https://meinklassenzimmer-qual.web.app
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Qual
        run: npm run build:qual

      - name: Deploy to Firebase Hosting (Qual)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_QUAL != '' && vars.FIREBASE_PROJECT_QUAL || 'meinklassenzimmer-qual' }}
        run: npx firebase-tools deploy --only hosting --project "$PROJECT_ID" --token "$FIREBASE_TOKEN"

  deploy-prod:
    name: Deploy to Production
    needs: [test, deploy-qual]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mindcat-focus-training.web.app
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production
        run: npm run build:prod

      - name: Deploy to Firebase Hosting (Prod)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_PROD != '' && vars.FIREBASE_PROJECT_PROD || 'mindcat-focus-training' }}
        run: npx firebase-tools deploy --only hosting --project "$PROJECT_ID" --token "$FIREBASE_TOKEN"
